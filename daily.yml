name: Günlük AI haberlerini topla
on:
  schedule:
    - cron: '17 5 * * *' # UTC 05:17 = Türkiye 08:17
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          TRANSLATE: '1'
          MAX_ITEMS: '100'
      - name: Yeni haber varsa depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Günlük yapay zekâ haberleri güncellendi"
            git push
          fi
